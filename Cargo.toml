[package]
name = "bottle"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
directories = "6"
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
rmcp = { version = "3.1.4", features = ["server", "macros", "transport-io", "schemars"] }
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
rust_decimal = "1.42.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
serde_yaml = "0.9"
tokio = { version = "1.53.1", features = ["macros", "rt", "io-std"] }

[dev-dependencies]
rmcp = { version = "3.1.4", features = ["client", "transport-child-process"] }
tempfile = "3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "process"] }
